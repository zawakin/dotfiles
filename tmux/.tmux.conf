# ==========================================
#  基本設定 (Prefix)
# ==========================================

# 1. プレフィックスを「Ctrl + b」から「Ctrl + a」に変更
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ターミナルカラー (True color 24-bit 対応)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# エスケープ遅延の除去 (Vi モードやエディタ操作をスムーズに)
set -s escape-time 0

# 設定ファイルをリロードするショートカット (Ctrl+a -> r)
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ==========================================
#  操作性 (iTerm2ライク・直感的)
# ==========================================

# 2. 画面分割
# | で縦に割る（現在のディレクトリを維持）
bind | split-window -h -c "#{pane_current_path}"
# - で横に割る（現在のディレクトリを維持）
bind - split-window -v -c "#{pane_current_path}"

# 3. 新しいウィンドウ (タブ) 作成
# 作成時はホームディレクトリ（または初期ディレクトリ）に戻る
bind c new-window

# 4. ペイン移動 (矢印キー)
bind -r Up select-pane -U
bind -r Down select-pane -D
bind -r Left select-pane -L
bind -r Right select-pane -R

bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D

# 5. マウス操作を有効にする
set -g mouse on

# 6. 番号基準値を変更 (キーボードの並びに合わせる)
set -g base-index 1          # ウィンドウ番号を1から開始
setw -g pane-base-index 1    # ペイン番号を1から開始

# 7. スクロールバック行数を増やす (デフォルトは少ないので)
set -g history-limit 10000

# 8. Vi モード (コピーモードを Vi キーバインドに)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# 9. フォーカスイベント (Vim/Neovim の FocusGained/FocusLost 対応)
set -g focus-events on

# エスケープシーケンスのパススルー (画像表示、OSC 52 クリップボード連携など)
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# 10. ウィンドウ自動リナンバー (閉じた時に番号を詰める)
set -g renumber-windows on

# ==========================================
#  見た目・タブバー (Status Bar)
# ==========================================

# 8. ステータスバーを「上」に配置
set-option -g status-position top

# 9. 更新頻度 (1秒ごとに更新)
set-option -g status-interval 1

# 10. 色設定
set -g status-bg "colour235"  # バーの背景色 (黒に近いグレー)
set -g status-fg "colour255"  # 文字色 (白)

# 11. 左側の表示 (セッション名)
set -g status-left-length 30
set -g status-left '#[fg=green,bold] [#S] #[default]'

# 12. 右側の表示 (時計など)
set -g status-right '#[fg=white] %Y-%m-%d(%a) %H:%M '

# 13. タブ (ウィンドウ) の見た目
# アクティブなタブ: 背景青、文字白、太字
setw -g window-status-current-style fg=white,bg=blue,bold
setw -g window-status-current-format ' #I: #W '

# 非アクティブなタブ
setw -g window-status-format ' #I: #W '

# ペインボーダーのスタイル (アクティブペインを視覚的に区別)
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour33

# アクティビティ監視 (バックグラウンドウィンドウの出力をハイライト)
setw -g monitor-activity on
set -g visual-activity off

# ==========================================
#  タイトル・リネーム設定 (Claude対応版)
# ==========================================
set-option -g allow-rename on
set-option -g set-titles on
set-option -g set-titles-string "#S:#W"
set-option -g automatic-rename on

# 解説:
# 1. コマンドが "claude" か？ -> 真なら #W (現在のタイトル=アプリが付けた名前) を維持
# 2. 偽なら、コマンドが "fish" か？ -> 真ならフォルダ名
# 3. それ以外ならコマンド名
set-option -g automatic-rename-format '#{?#{==:#{pane_current_command},claude},#W,#{?#{==:#{pane_current_command},fish},#{b:pane_current_path},#{pane_current_command}}}'

# ペインを閉じる時の確認 (y/n) を無効にする
bind x kill-pane

# ==========================================
#  ステータスバー左側の設定 (修正版)
# ==========================================

set -g status-left-length 30

# 解説: #{?client_prefix, A, B}
# A (押した時):   黄色背景・黒文字で [WAIT] と表示
# B (通常時):     緑文字で [セッション名] を表示
set -g status-left '#{?client_prefix,#[reverse]#[bold] WAIT! #[default],#[fg=green,bold] [#S] #[default]}'

